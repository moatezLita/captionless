name: tests

# Offline tests on Linux, macOS and Windows. They use a fake speech-to-text server, so they need
# no API key and never contact a video site.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed:
    name: installed, ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install as a command (what pipx and uvx do)
        run: python -m pip install .
      - run: captionless --version
      - run: captionless doctor
      - run: python -m unittest discover -s tests -v

  first-run:
    # Nothing is installed here: the script has to build its own environment, as it does for a new user.
    name: first run, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
