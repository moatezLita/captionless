name: publish

# Uploads captionless to PyPI when a GitHub release is published, so that
# `pipx install captionless` and `uvx captionless` work.
#
# One-time setup on pypi.org (no password or token is stored in this repository):
#   Account -> Publishing -> Add a pending publisher
#     PyPI project name: captionless      Owner: moatezLita      Repository: captionless
#     Workflow name: publish.yml          Environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
